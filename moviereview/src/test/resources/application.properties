# Application name
spring.application.name=moviereview

# Server configuration
server.port=9092

# H2 Database configuration for testing
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA/Hibernate configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Logging configuration
logging.level.root=INFO
logging.level.com.abc.moviereview=DEBUG
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

# Actuator configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus,loggers
management.endpoint.health.show-details=always
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true

# Enhanced metrics configuration
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.http.client.requests=true
management.metrics.distribution.slo.http.server.requests=50ms, 100ms, 200ms, 500ms
management.metrics.tags.application=${spring.application.name}
management.metrics.web.server.request.autotime.enabled=true

# OpenTelemetry configuration for tests
# This is the default configuration, but tests can override it with @TestPropertySource
otel.sdk.disabled=true
management.tracing.enabled=false
otel.exporter.otlp.endpoint=http://localhost:4317

# Tracing configuration
management.tracing.sampling.probability=1.0

# Spring profiles
spring.profiles.active=test
