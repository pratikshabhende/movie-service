name: CI/CD - Cloud Run

on:
  push:
    branches: [ "main", "feature" ]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloudrun-${{ github.ref }}
  cancel-in-progress: true

env:
  # Required repo secrets:
  # - GCP_PROJECT_ID
  # - GCP_REGION (e.g. us-central1)
  # - GCP_ARTIFACT_REPO (Artifact Registry docker repo name)
  # - GCP_WORKLOAD_IDENTITY_PROVIDER (full resource name)
  # - GCP_SERVICE_ACCOUNT (service account email for WIF)
  #
  # Optional secrets (Sonar):
  # - SONAR_HOST_URL (default: https://sonarcloud.io)
  # - SONAR_ORG
  # - SONAR_TOKEN
  #
  # Optional secrets (override per project):
  # - SONAR_PROJECTKEY_MOVIEWORLD
  # - SONAR_PROJECTKEY_MOVIEREVIEW
  # - SONAR_PROJECTKEY_MOVIEAPP
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ secrets.GCP_REGION }}
  GCP_ARTIFACT_REPO: ${{ secrets.GCP_ARTIFACT_REPO }}
  SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}
  SONAR_ORG: ${{ secrets.SONAR_ORG }}
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  SONAR_PROJECTKEY_MOVIEWORLD: ${{ secrets.SONAR_PROJECTKEY_MOVIEWORLD }}
  SONAR_PROJECTKEY_MOVIEREVIEW: ${{ secrets.SONAR_PROJECTKEY_MOVIEREVIEW }}
  SONAR_PROJECTKEY_MOVIEAPP: ${{ secrets.SONAR_PROJECTKEY_MOVIEAPP }}

jobs:
  backend_test_coverage_sonar:
    name: Backend - test, coverage, sonar
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - movieworld
          - moviereview
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run unit tests + JaCoCo report
        run: mvn -B test

      - name: Upload coverage report (JaCoCo)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service }}-jacoco
          if-no-files-found: error
          path: |
            ${{ matrix.service }}/target/site/jacoco/
            ${{ matrix.service }}/target/site/jacoco/jacoco.xml

      - name: Sonar analysis (Maven)
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_ORG != '' }}
        run: |
          if [ "${{ matrix.service }}" = "movieworld" ]; then
            SONAR_PROJECT_KEY="${{ env.SONAR_PROJECTKEY_MOVIEWORLD }}"
          else
            SONAR_PROJECT_KEY="${{ env.SONAR_PROJECTKEY_MOVIEREVIEW }}"
          fi

          if [ -z "$SONAR_PROJECT_KEY" ]; then
            echo "Missing SONAR_PROJECT_KEY for ${{ matrix.service }} (set SONAR_PROJECTKEY_MOVIEWORLD / SONAR_PROJECTKEY_MOVIEREVIEW)."
            exit 1
          fi

          mvn -B sonar:sonar \
            -Dsonar.host.url="${SONAR_HOST_URL}" \
            -Dsonar.organization="${SONAR_ORG}" \
            -Dsonar.projectKey="${SONAR_PROJECT_KEY}" \
            -Dsonar.coverage.jacoco.xmlReportPaths="target/site/jacoco/jacoco.xml"

  frontend_test_coverage_sonar:
    name: Frontend - test, coverage, sonar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: movieapp
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: movieapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests + coverage (Jest)
        run: npm run test:ci -- --coverage

      - name: Upload coverage report (Jest)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-movieapp-jest
          if-no-files-found: error
          path: |
            coverage/

      - name: Sonar analysis (frontend)
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_ORG != '' && env.SONAR_PROJECTKEY_MOVIEAPP != '' }}
        uses: SonarSource/sonarcloud-github-action@v3
        with:
          projectBaseDir: movieapp
          args: >
            -Dsonar.host.url=${{ env.SONAR_HOST_URL }}
            -Dsonar.organization=${{ env.SONAR_ORG }}
            -Dsonar.projectKey=${{ env.SONAR_PROJECTKEY_MOVIEAPP }}
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info

  build_scan_push_backend:
    name: Backend - build, scan, push
    runs-on: ubuntu-latest
    needs: [ backend_test_coverage_sonar ]
    strategy:
      fail-fast: false
      matrix:
        service:
          - movieworld
          - moviereview
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure docker auth for Artifact Registry
        run: gcloud auth configure-docker "${{ env.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build jar (skip tests)
        run: mvn -B -f "${{ matrix.service }}/pom.xml" -DskipTests package

      - name: Build docker image
        env:
          IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_ARTIFACT_REPO }}/${{ matrix.service }}:${{ github.sha }}
        run: docker build -t "$IMAGE" "${{ matrix.service }}"

      - name: Scan docker image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_ARTIFACT_REPO }}/${{ matrix.service }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Push docker image
        env:
          IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_ARTIFACT_REPO }}/${{ matrix.service }}:${{ github.sha }}
        run: docker push "$IMAGE"

  deploy_backend:
    name: Backend - deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: [ build_scan_push_backend ]
    strategy:
      fail-fast: false
      matrix:
        service:
          - movieworld
          - moviereview
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy ${{ matrix.service }}
        env:
          IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_ARTIFACT_REPO }}/${{ matrix.service }}:${{ github.sha }}
        run: |
          gcloud run deploy "${{ matrix.service }}" \
            --image "$IMAGE" \
            --region "${{ env.GCP_REGION }}" \
            --project "${{ env.GCP_PROJECT_ID }}" \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --quiet

  build_scan_push_frontend:
    name: Frontend - build, scan, push
    runs-on: ubuntu-latest
    needs: [ frontend_test_coverage_sonar ]
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure docker auth for Artifact Registry
        run: gcloud auth configure-docker "${{ env.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: movieapp/package-lock.json

      - name: Install dependencies
        working-directory: movieapp
        run: npm ci

      - name: Build Angular app
        working-directory: movieapp
        run: npm run build

      - name: Build docker image
        env:
          IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_ARTIFACT_REPO }}/movieapp:${{ github.sha }}
        run: docker build -t "$IMAGE" movieapp

      - name: Scan docker image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_ARTIFACT_REPO }}/movieapp:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Push docker image
        env:
          IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_ARTIFACT_REPO }}/movieapp:${{ github.sha }}
        run: docker push "$IMAGE"

  deploy_frontend:
    name: Frontend - deploy to Cloud Run (after backends)
    runs-on: ubuntu-latest
    needs: [ deploy_backend, build_scan_push_frontend ]
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy movieapp
        env:
          IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_ARTIFACT_REPO }}/movieapp:${{ github.sha }}
        run: |
          gcloud run deploy "movieapp" \
            --image "$IMAGE" \
            --region "${{ env.GCP_REGION }}" \
            --project "${{ env.GCP_PROJECT_ID }}" \
            --platform managed \
            --allow-unauthenticated \
            --port 80 \
            --quiet

